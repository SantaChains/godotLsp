[package]
name = "godotlsp"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A standalone, engine-free GDScript language server speaking LSP 3.17 over stdio"
repository = "https://github.com/godotlsp/godotlsp"

[dependencies]
gdscript-syntax = { path = "../gdscript-syntax" }
gdscript-engine = { path = "../gdscript-engine" }
gdscript-project = { path = "../gdscript-project" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[lints.rust]
unsafe_code = "deny"

