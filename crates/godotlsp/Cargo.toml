[package]
name = "godotlsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A standalone, engine-free GDScript language server speaking LSP 3.17 over stdio"
repository = "https://github.com/godotlsp/godotlsp"

[build-dependencies]
regex = "1"

[dependencies]
gdscript-ide = "0.6.1"
gdscript-base = "0.6.1"
gdscript-api = "0.6.1"
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
serde = "1"
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
