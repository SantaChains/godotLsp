# mdBook 中文参考站部署到 GitHub Pages
# 仓库 Settings -> Pages -> Build and deployment -> Source 需选择「GitHub Actions」
# （configure-pages 的 enablement: true 也会尝试自动启用，手动设置一次最稳）
# 安全基线：action 全部按 commit SHA 固定、job 级最小权限、关闭凭据持久化、锁定构建版本
name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: 缓存 mdBook 二进制
        id: mdbook-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4
      - name: 安装 mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --version 0.5.4 --locked
      - name: 构建
        run: mdbook build website
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
